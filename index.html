<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen: AI workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap">
<style>
:root{
  --paper:#F3F5F9; --panel:#FFFFFF; --ink:#14182B; --muted:#6A7088; --line:#DDE1EC;
  --accent:#3B3FD9; --accent-ink:#FFFFFF; --glow1:#D9DBFB; --glow2:#D0F1E6; --soft:#E6E8FB; --mint:#CDEFE3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1220; --panel:#171B2E; --ink:#ECEEF8; --muted:#9298B3; --line:#262B45;
    --accent:#8A8DFF; --accent-ink:#0F1220; --glow1:#1E2455; --glow2:#12302A; --soft:#232852; --mint:#1D3A33;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1220; --panel:#171B2E; --ink:#ECEEF8; --muted:#9298B3; --line:#262B45;
  --accent:#8A8DFF; --accent-ink:#0F1220; --glow1:#1E2455; --glow2:#12302A; --soft:#232852; --mint:#1D3A33;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 85% -10%,var(--glow1),transparent 60%),radial-gradient(700px 380px at 5% 110%,var(--glow2),transparent 60%),var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:260px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:14px;min-height:0}
.brand{font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:26px;height:26px;border-radius:50% 50% 50% 8px;background:conic-gradient(from 200deg,var(--accent),#7AD9C0,var(--accent));box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.new{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 14px;font-weight:500;cursor:pointer;text-align:left}
.new:hover{filter:brightness(1.08)}
.hist{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0}
.hist-title{color:var(--muted);font-size:13px;padding:6px 8px}
.hist button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover{background:var(--paper)}
.theme{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:none;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.scroll{flex:1;overflow:auto;padding:28px 20px 12px;min-height:0}
.col{max-width:720px;margin:0 auto}

.hero{padding-top:8vh}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 12px;font-weight:700}
.hero p{color:var(--muted);margin:0 0 26px;max-width:46ch}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.chip:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 24px -16px color-mix(in srgb,var(--accent) 60%,transparent)}
.chip b{display:block;font-weight:500;margin-bottom:2px}
.chip span{color:var(--muted);font-size:14px}

.msg{display:flex;gap:12px;margin:0 0 22px}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.msg.user{flex-direction:row-reverse}.msg.user .av{display:none}.msg.user .body{background:var(--soft);padding:10px 15px;border-radius:18px 18px 4px 18px;max-width:80%}
.msg.ai .av{background:var(--accent);color:var(--accent-ink);border-radius:50% 50% 50% 6px}
.body{padding-top:3px;max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.dots{display:inline-flex;gap:4px;padding-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

.composer{padding:10px 20px 18px}
.box{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 34px -16px color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
textarea{flex:1;border:0;background:none;resize:none;max-height:160px;padding:8px 0;outline:none;line-height:1.45}
textarea::placeholder{color:var(--muted)}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:500;cursor:pointer}
.send:disabled{opacity:.4;cursor:not-allowed}
.note{max-width:720px;margin:8px auto 0;color:var(--muted);font-size:13px;text-align:center}

.chip em{font-style:normal;font-weight:700;width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:12px}
.orb{width:60px;height:60px;border-radius:50% 50% 50% 14px;background:conic-gradient(from 200deg,var(--accent),#7AD9C0,var(--accent));margin-bottom:22px;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 35%,transparent)}50%{box-shadow:0 0 0 18px transparent}}
.actions{margin-top:10px}
.actions button{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.actions button:hover{color:var(--ink);border-color:var(--accent)}
.hist button:first-child{background:var(--soft)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .top{display:flex}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Chats">
    <div class="brand"><span class="mark"></span>Lumen</div>
    <button class="new" id="newBtn">New chat</button>
    <div class="hist-title">Recent</div>
    <div class="hist" id="hist"></div>
    <button class="theme" id="themeBtn">Switch theme</button>
  </aside>

  <section class="main">
    <div class="top"><button id="menuBtn" aria-label="Open chats">Menu</button><b>Lumen</b></div>
    <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask Lumen anything" aria-label="Message"></textarea>
        <button class="send" id="sendBtn" disabled>Send</button>
      </div>
      <div class="note" id="note">Demo replies are simulated. Connect a real model to get real answers.</div>
    </div>
  </section>
</div>

<script>
const col=document.getElementById('col'), scroller=document.getElementById('scroll');
const input=document.getElementById('input'), sendBtn=document.getElementById('sendBtn');
const hist=document.getElementById('hist'), side=document.getElementById('side');
const prompts=[
  {i:'✦',t:'Explain an idea',d:'Break down recursion in simple words'},
  {i:'✉',t:'Draft a message',d:'Ask a professor for a deadline extension'},
  {i:'◷',t:'Plan my week',d:'Balance classes, coding practice and rest'},
  {i:'{}',t:'Debug my code',d:'Why does my JavaScript loop never end?'}
];
const replies={
  message:"Subject: Request for a deadline extension\n\nDear Professor [Name],\n\nI hope you are well. I am writing to ask if I could have a short extension on [assignment name], currently due on [date]. [One line on the reason.]\n\nI have already completed [progress so far] and can submit the rest by [new date].\n\nThank you for considering this.\n\nRegards,\n[Your name]",
  loop:"The most common reasons a loop never ends:\n\n1. The condition never becomes false, for example while (i < 10) with no change to i inside the loop.\n2. The counter moves the wrong way, such as i-- in a loop that checks i < 10.\n3. The counter is reset to its starting value inside the loop body.\n\nPaste your loop and I can point to the exact line.",
  default:"Here is a first take.\n\nThis is a simulated reply so you can see how streaming text looks in the interface. To make Lumen answer for real, replace getReply() in the script with a call to your own backend that talks to an AI model.",
  recursion:"Recursion is when a function solves a problem by calling itself on a smaller version of that problem.\n\nThink of opening nested boxes. You open one, find a smaller box inside, and repeat until you reach an empty one. That empty box is your base case, and it is what stops the process.",
  week:"A simple structure for the week:\n\nMon to Fri: classes in the day, then one focused coding block of 60 to 90 minutes in the evening.\nSat: a project session of two to three hours.\nSun: review the week and rest.\n\nKeep one evening free so the plan survives a busy week."
};
let busy=false, sample=null, ctl=null;
const turns=[];
const note=document.getElementById('note');
const RULES='You are Lumen, a friendly AI assistant inside a chat app. Reply in plain text only, with no markdown symbols such as asterisks or hash signs. Keep answers clear and under 180 words unless the person asks for more detail. Use short paragraphs.';
function setNote(){note.textContent=sample?'Answers come from Claude and use your own Claude usage. You will be asked to allow this once.':'Demo replies are simulated. Connect a real model to get real answers.';}
if(window.claude&&claude.use){claude.use('sample').then(f=>{if(f){sample=f;setNote();}}).catch(()=>{});}

function getReply(text){ // swap this with a real API call later
  const q=text.toLowerCase();
  const has=(...k)=>k.some(w=>q.includes(w));
  const out=has('recurs')?replies.recursion:has('week','balance','classes','schedule','plan')?replies.week:has('professor','extension','deadline','email','message')?replies.message:has('loop','never end','infinite','bug','javascript')?replies.loop:replies.default;
  return new Promise(r=>setTimeout(()=>r(out),700));
}

function hero(){
  col.innerHTML='';
  const h=document.createElement('div');h.className='hero';
  h.innerHTML='<div class="orb"></div><h1>What do you want to make today?</h1><p>Ask a question, draft something or work through a problem step by step.</p>';
  const g=document.createElement('div');g.className='chips';
  prompts.forEach(p=>{
    const b=document.createElement('button');b.className='chip';
    b.innerHTML='<em></em><b></b><span></span>';
    b.children[0].textContent=p.i;b.children[1].textContent=p.t;b.children[2].textContent=p.d;
    b.onclick=()=>send(p.d);g.appendChild(b);
  });
  h.appendChild(g);col.appendChild(h);
}

function addMsg(role,text){
  const m=document.createElement('div');m.className='msg '+role;
  const a=document.createElement('div');a.className='av';a.textContent=role==='user'?'You'.slice(0,1):'L';
  const b=document.createElement('div');b.className='body';b.textContent=text||'';
  m.append(a,b);col.appendChild(m);scroller.scrollTop=scroller.scrollHeight;return b;
}

async function send(text){
  text=(text||input.value).trim();
  if(!text||busy)return;
  busy=true;sendBtn.disabled=true;
  if(col.querySelector('.hero')){col.innerHTML='';}
  addMsg('user',text);
  input.value='';input.style.height='auto';
  addToHistory(text);
  const body=addMsg('ai','');
  body.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  let reply='', demo=!sample;
  if(sample){
    turns.push({role:'user',content:text});
    ctl=new AbortController();sendBtn.textContent='Stop';sendBtn.disabled=false;
    try{
      const r=await sample([{role:'user',content:RULES},...turns],{cache:false,modelTier:'quick',signal:ctl.signal,
        onText:({text:t})=>{body.textContent=t;scroller.scrollTop=scroller.scrollHeight;}});
      reply=r.text;turns.push({role:'assistant',content:reply});
    }catch(e){
      const gone=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code);
      if(gone){sample=null;setNote();}
      if(e.text){reply=e.text;turns.push({role:'assistant',content:reply});}
      else{
        turns.pop();
        if(gone){demo=true;}
        else if(e.code==='cancelled'){body.textContent='Stopped.';}
        else{body.textContent=e.code==='rate_limited'?'Too many requests right now. Wait a moment and try again.':'Something went wrong. Send your message again.';}
      }
    }
    sendBtn.textContent='Send';ctl=null;
  }
  if(demo){
    reply=await getReply(text);
    body.textContent='';
    for(let i=0;i<reply.length;i++){
      body.textContent+=reply[i];
      scroller.scrollTop=scroller.scrollHeight;
      await new Promise(r=>setTimeout(r,12));
    }
  }
  const act=document.createElement('div');act.className='actions';
  const cp=document.createElement('button');cp.textContent='Copy';
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(reply);cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1500);}catch(e){cp.textContent='Copy not available';}};
  if(reply){act.appendChild(cp);body.appendChild(act);}
  scroller.scrollTop=scroller.scrollHeight;
  busy=false;sendBtn.disabled=!input.value.trim();
}

function addToHistory(t){
  if(hist.dataset.last===t)return;hist.dataset.last=t;
  const b=document.createElement('button');b.textContent=t;
  hist.prepend(b);
}

input.addEventListener('input',()=>{
  input.style.height='auto';input.style.height=input.scrollHeight+'px';
  sendBtn.disabled=(busy&&ctl)?false:(busy||!input.value.trim());
});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
sendBtn.onclick=()=>{if(busy&&ctl){ctl.abort();return;}send();};
document.getElementById('newBtn').onclick=()=>{if(ctl)ctl.abort();turns.length=0;hero();side.classList.remove('open');};
document.getElementById('menuBtn').onclick=()=>side.classList.toggle('open');
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};
hero();
</script>
</body>
</html>
